# CARINA hardware pack: laptops, convertibles and tablets
# shellcheck shell=bash disable=SC2034

DESCRIPTION="Laptop: Wi-Fi via NetworkManager, power management, lid/suspend, firmware updates, roaming firewall"

pack_matches() {
    # Never on a VM or container, even if the host passes a battery through
    [[ "$VIRT_TYPE" == "none" ]] || return 1
    [[ "$HAS_BATTERY" == "1" ]] || [[ "$CHASSIS" =~ ^(laptop|convertible|tablet)$ ]]
}
